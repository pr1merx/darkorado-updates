# Posts the latest Darkorado update in Discord again (for testing the #updates webhook).
name: Announce latest update
on: workflow_dispatch
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      DISCORD_UPDATES_WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Post the latest update in Discord
        run: |
          set -e
          case "$DISCORD_UPDATES_WEBHOOK" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo "The DISCORD_UPDATES_WEBHOOK secret must be the full webhook link (https://discord.com/api/webhooks/...)."; exit 1 ;;
          esac
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,body > /tmp/rel.json
          python3 -c "import json; r=json.load(open('/tmp/rel.json')); open('/tmp/notes.md','w').write(r['body']); open('/tmp/v','w').write(r['tagName'].lstrip('v'))"
          python3 .github/post-update.py "$(cat /tmp/v)" /tmp/notes.md /tmp/payload.json
          curl -sS --fail -F "payload_json=</tmp/payload.json" -F "files[0]=@.github/darkorado-icon.png;filename=darkorado.png" "$DISCORD_UPDATES_WEBHOOK" > /dev/null
          echo "Posted."
